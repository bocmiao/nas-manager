name: NasManager
options:
  bundleIdPrefix: dev.nasmanager
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # SWIFT_VERSION 只接受语言模式（4.0 / 4.2 / 5.0 / 6.0），写 5.9 会被 xcodebuild 判为不支持
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  NasManager:
    type: application
    platform: iOS
    sources:
      - path: NasManager
    info:
      path: NasManager/Info.plist
      properties:
        CFBundleDisplayName: NAS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # 自签证书 + 局域网地址，自用不上架
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 需要访问局域网内的 NAS 设备
        # Face ID 必须声明用途，否则调用 LocalAuthentication 会直接终止进程
        NSFaceIDUsageDescription: 用 Face ID 解锁已保存在本机的 NAS 密码
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nasmanager.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: "NO"
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      # app-extension 用 embed: true 会被拷进 .app/PlugIns；写成 framework 会构建失败
      - target: NasManagerWidget
        embed: true

  NasManagerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NasManagerWidget
      # 与主 App 共用的快照读写代码，同一个文件加进两个 target
      - path: NasManager/Core/WidgetBridge.swift
    info:
      path: NasManagerWidget/Info.plist
      properties:
        CFBundleDisplayName: NAS
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          # WidgetKit 扩展不需要 NSExtensionPrincipalClass，@main 由 WidgetBundle 提供
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nasmanager.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  NasManager:
    build:
      targets:
        NasManager: all
        NasManagerWidget: all
    run:
      config: Debug
    archive:
      config: Release
