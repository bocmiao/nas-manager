name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'scripts/build-ios.sh'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:
    inputs:
      adhoc:
        description: '打 Ad-Hoc 签名包（需配置 Secrets，见 README）'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 安装 XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      # 只有 Ad-Hoc 模式才导入证书；无签名模式完全跳过
      - name: 导入签名证书
        if: github.event.inputs.adhoc == 'true'
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          echo "$BUILD_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" \
            -P "$BUILD_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KC" > /dev/null
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')

      - name: 构建
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          chmod +x scripts/build-ios.sh
          if [ "${{ github.event.inputs.adhoc }}" = "true" ]; then
            ./scripts/build-ios.sh --clean --adhoc
          else
            ./scripts/build-ios.sh --clean
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NasManager-ipa
          path: ios/build/export/*.ipa
          retention-days: 14
